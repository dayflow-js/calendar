name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs only build; keep them out of 'pages' so they can't queue behind or replace a pending deploy
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          cd website
          npm install --legacy-peer-deps

      - name: Build website
        run: |
          cd website
          npm run build
        env:
          BASE_PATH: ''
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SITE_URL: https://calendar.dayflow.studio

      - name: Disable Jekyll and verify output
        run: |
          ls -la website/
          if [ -d "website/out" ]; then
            touch website/out/.nojekyll
            echo "calendar.dayflow.studio" > website/out/CNAME
            echo "Created .nojekyll and CNAME in website/out"
          else
            echo "Error: website/out directory not found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
