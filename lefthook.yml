pre-commit:
  # Run jobs in order and stop at the first failure: format and lint fixes are
  # re-staged before the tests see the tree, and a lint failure skips the test run.
  piped: true
  jobs:
    - run: pnpm --filter @dayflow/core run check:css

    # Staged files only: running on the whole repo rewrites unrelated files and leaves them unstaged
    - run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - run: pnpm exec oxlint --fix {staged_files}
      glob:
        - '*.js'
        - '*.jsx'
        - '*.ts'
        - '*.tsx'
        - '*.json'
        - '*.jsonc'
        - '*.css'
        - '*.md'
      stage_fixed: true

    # The full suite CI runs (vitest + Angular). Skipped when nothing it covers
    # is staged, such as docs-only or website-only commits.
    - name: test
      run: pnpm test
      glob:
        - '*.{js,jsx,mjs,cjs,ts,tsx,vue,svelte,json}'
        - 'pnpm-lock.yaml'
        - 'pnpm-workspace.yaml'
      exclude:
        - 'website/**'
